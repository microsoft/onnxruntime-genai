name: "Windows CUDA x64 Build"
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rel-*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  AZCOPY_AUTO_LOGIN_TYPE: MSI
  AZCOPY_MSI_CLIENT_ID: d712a4c7-a0cf-4e87-af75-31510eba0a8e
  cuda_dir: "${{ github.workspace }}\\cuda_sdk"
  cuda_version: "12.8"
  CUDA_PATH: ${{ github.workspace }}\\cuda_sdk\\v12.8
  buildRoot: 'build/cuda/win-x64'
  binaryDir: 'build/cuda/win-x64/Release'
  ORT_NUGET_SOURCE: "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/nuget/v3/index.json"
  ORT_EP_NUGET_SOURCE: "https://pkgs.dev.azure.com/aiinfra/PublicPackages/_packaging/ORT-Nightly/nuget/v3/index.json"
  ORT_EP_PYPI_SOURCE: "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/pypi/simple/"
  ORT_PACKAGE_NAME: "Microsoft.ML.OnnxRuntime"
  ORT_PACKAGE_VERSION: "1.30.0-dev-20260825-0522-9cbf665b59"
  ORT_EP_PACKAGE_NAME: "Microsoft.ML.OnnxRuntime.EP.Cuda12.win-x64"
  ORT_EP_NUGET_VERSION: "0.2.0-dev.20260819+f1d07f0d"
  ORT_EP_PYPI_VERSION: "0.2.0.dev20260819"

jobs:
  windows-cuda-x64-build:
    runs-on: ["self-hosted", "1ES.Pool=onnxruntime-genai-Win2022-GPU-A10"]
    steps:
      - name: Checkout OnnxRuntime GenAI repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11.x'
          architecture: 'x64'

      - name: Setup VCPKG
        uses: microsoft/onnxruntime-github-actions/setup-build-tools@47a55233e7a9e40e8ade1a71d1b6141be5044924 # v0.0.8
        with:
          vcpkg-version: '2025.03.19'
          vcpkg-hash: '17e96169cd3f266c4716fcdc1bb728e6a64f103941ece463a2834d50694eba4fb48f30135503fd466402afa139abc847ef630733c442595d1c34979f261b0114'
          cmake-version: '3.31.6'
          cmake-hash: '0f1584e8666cf4a65ec514bd02afe281caabf1d45d2c963f3151c41484f457386aa03273ab25776a670be02725354ce0b46f3a5121857416da37366342a833a0'
          add-cmake-to-path: 'true'
          disable-terrapin: 'false'

      - name: Download cuda
        run: |
          azcopy.exe cp --recursive "https://lotusscus.blob.core.windows.net/models/cuda_sdk/v${{ env.cuda_version }}" ${{ env.cuda_dir}}

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Download ONNX Runtime and CUDA EP plugin
        shell: pwsh
        run: |
          nuget install $env:ORT_PACKAGE_NAME -Version $env:ORT_PACKAGE_VERSION -Source $env:ORT_NUGET_SOURCE -ExcludeVersion -NonInteractive
          nuget install $env:ORT_EP_PACKAGE_NAME -Version $env:ORT_EP_NUGET_VERSION -Source $env:ORT_EP_NUGET_SOURCE -ExcludeVersion -NonInteractive -DependencyVersion Ignore

      - run: |
          Get-ChildItem $env:ORT_PACKAGE_NAME -Recurse
          Get-ChildItem $env:ORT_EP_PACKAGE_NAME -Recurse
        continue-on-error: true

      - name: Stage ONNX Runtime and CUDA EP plugin
        run: |
          New-Item -ItemType Directory -Force -Path ort/lib, ort/ep | Out-Null
          Move-Item "$env:ORT_PACKAGE_NAME/build/native/include" ort/
          Copy-Item "$env:ORT_PACKAGE_NAME/runtimes/win-x64/native/*" ort/lib/ -Force
          Copy-Item "$env:ORT_EP_PACKAGE_NAME/runtimes/win-x64/native/*" ort/ep/ -Force

      - name: Install Rust Toolchain
        run: |
          $exePath = "$env:TEMP\rustup-init.exe"
          (New-Object Net.WebClient).DownloadFile('https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe', $exePath)
          & $exePath -y --default-toolchain=1.86.0
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      # Restore sccache from a previous run so the C/C++ compile step gets cache hits.
      # restore-keys allow a partial match from any prior run on this branch or main.
      - name: Restore sccache
        id: restore-sccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}\sccache
          key: sccache-win-cuda-${{ hashFiles('.github/workflows/win-cuda-x64-build.yml', 'build.py', '**/CMakeLists.txt', 'cmake/**/*.cmake') }}
          restore-keys: |
            sccache-win-cuda-

      - name: Install sccache
        run: |
          $version = "0.9.0"
          $url = "https://github.com/mozilla/sccache/releases/download/v${version}/sccache-v${version}-x86_64-pc-windows-msvc.tar.gz"
          $dest = "$env:TEMP\sccache.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $dest
          tar -xzf $dest -C "$env:TEMP"
          $binDir = "$env:USERPROFILE\sccache_bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item "$env:TEMP\sccache-v${version}-x86_64-pc-windows-msvc\sccache.exe" "$binDir\sccache.exe"
          echo $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$binDir\sccache.exe" --version

      - name: Build with build.py
        run: |
          $env:SCCACHE_DIR = "${{ github.workspace }}\sccache"
          # Limit CUDA archs to SM 86 (matches the A10 runner GPU) to keep CI build
          # time and memory usage manageable.
          python -m pip install -r requirements-dev.txt
          python build.py `
            --config Release `
            --build_dir $env:buildRoot `
            --parallel `
            --build_java `
            --use_cuda `
            --cuda_home "${{ env.cuda_dir }}\v${{ env.cuda_version }}" `
            --use_guidance `
            --update --build `
            --skip_examples `
            --cmake_extra_defines `
              TEST_PHI2=False `
              TEST_QWEN_2_5=True `
              CMAKE_CUDA_ARCHITECTURES=86-real `
              CMAKE_C_COMPILER_LAUNCHER=sccache `
              CMAKE_CXX_COMPILER_LAUNCHER=sccache `
              'CMAKE_EXE_LINKER_FLAGS_INIT=/profile /DYNAMICBASE' `
              'CMAKE_MODULE_LINKER_FLAGS_INIT=/profile /DYNAMICBASE' `
              'CMAKE_SHARED_LINKER_FLAGS_INIT=/profile /DYNAMICBASE' `
              'CMAKE_C_FLAGS=/EHsc /Qspectre /MP /guard:cf /DWIN32 /D_WINDOWS /DWINAPI_FAMILY=100 /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A000000 /O2 /Ob2 /DNDEBUG' `
              'CMAKE_CXX_FLAGS=/EHsc /Qspectre /MP /guard:cf /DWIN32 /D_WINDOWS /DWINAPI_FAMILY=100 /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A000000 /O2 /Ob2 /DNDEBUG' `
              'CMAKE_CUDA_FLAGS_INIT=/DWIN32 /D_WINDOWS /DWINAPI_FAMILY=100 /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A000000 -Xcompiler=" /MP /guard:cf /Qspectre " -allow-unsupported-compiler'

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Stage CPU ONNX Runtime for tests
        shell: pwsh
        run: |
          $nativeOutput = "$env:GITHUB_WORKSPACE\$env:binaryDir\Release"
          Remove-Item "$nativeOutput\onnxruntime_providers_cuda.dll" -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:GITHUB_WORKSPACE\ort\lib\*" $nativeOutput -Force

          if (Test-Path "$nativeOutput\onnxruntime_providers_cuda.dll") {
            throw "The provider-bridge CUDA library must not be present in the native test runtime."
          }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\ort\ep\onnxruntime_providers_cuda.dll")) {
            throw "CUDA EP plugin was not staged in ort/ep."
          }

      # Save sccache inline (before the test steps) so the cache is written even if
      # a later step kills the runner. Skip if we had a full key hit (nothing new to store).
      - name: Save sccache
        if: steps.restore-sccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}\sccache
          key: sccache-win-cuda-${{ hashFiles('.github/workflows/win-cuda-x64-build.yml', 'build.py', '**/CMakeLists.txt', 'cmake/**/*.cmake') }}

      - name: Add CUDA to PATH
        run: |
          echo "${{ env.cuda_dir }}\\v${{ env.cuda_version }}\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:GITHUB_WORKSPACE\ort\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:GITHUB_WORKSPACE\ort\ep" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the C Examples
        run: |
          cmake -S examples\c -B examples\c\build `
            -DMODEL_QA=ON -DMODEL_CHAT=ON -DMODEL_MM=ON -DWHISPER=ON -DNEMOTRON_SPEECH=ON `
            "-DORT_INCLUDE_DIR=$env:GITHUB_WORKSPACE\ort\include" `
            "-DORT_LIB_DIR=$env:GITHUB_WORKSPACE\ort\lib" `
            "-DOGA_INCLUDE_DIR=$env:GITHUB_WORKSPACE\src" `
            "-DOGA_LIB_DIR=$env:GITHUB_WORKSPACE\$env:binaryDir\Release"
          cmake --build examples\c\build --config Release

      - name: Install the Python Wheel and Test Dependencies
        run: |
          python -m pip uninstall -y onnxruntime-gpu
          python -m pip install -r test\python\requirements.txt
          python -m pip install -r test\python\cuda\torch\requirements.txt
          python -m pip install --index-url $env:ORT_EP_PYPI_SOURCE -r test\python\cuda\ort\requirements.txt
          python -m pip install --index-url $env:ORT_EP_PYPI_SOURCE onnxruntime-ep-cuda12==$env:ORT_EP_PYPI_VERSION
          python -m pip install (Get-ChildItem ("$env:binaryDir\wheel\*.whl")) --no-deps

      - name: Run the synthetic Engine Python tests
        run: |
          python -m pytest -sv test/python/test_onnxruntime_genai_engine.py

      - name: Run the Java tests
        run: |
          ctest --test-dir $env:binaryDir\src\java --build-config Release --verbose --timeout 10800

      - name: Run the Python Tests
        run: |
          python test/python/test_onnxruntime_genai.py --cwd "test\python" --test_models "test\models" --e2e

      - name: Verify Build Artifacts
        if: always()
        continue-on-error: true
        run: |2

          Get-ChildItem -Path $env:GITHUB_WORKSPACE\$env:binaryDir -Recurse

      - name: Build the C# API and Run the C# Tests
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\ort\ep;$env:GITHUB_WORKSPACE\ort\lib;${{ env.cuda_dir }}\\v${{ env.cuda_version }}\\bin;" + $env:PATH
          cd test\csharp
          dotnet test /p:Configuration=Release /p:NativeBuildOutputDir="$env:GITHUB_WORKSPACE\$env:binaryDir\Release" /p:OrtLibDir="$env:GITHUB_WORKSPACE\ort\lib" /p:EPDir="$env:GITHUB_WORKSPACE\ort\ep" /p:OrtPackageVersion="$env:ORT_PACKAGE_VERSION" /p:RestoreSources="$env:ORT_NUGET_SOURCE"

      - name: Build the C# Examples
        run: |
          cd examples\csharp\ModelChat
          dotnet build -c Release
          cd ..\ModelMM
          dotnet build -c Release

      - name: Test the C# LLM Example with Tool Calling
        run: |
          python test\python\special_tokens.py -p test\models\qwen-2.5-0.5b\int4\cpu\tokenizer.json -s "<tool_call>" -e "</tool_call>"
          .\examples\csharp\ModelChat\bin\Release\net8.0\ModelChat.exe -m test\models\qwen-2.5-0.5b\int4\cpu\ -e cpu --response_format lark_grammar --tools_file test\models\tool-definitions\weather.json --tool_call_start "<tool_call>" --tool_call_end "</tool_call>" --user_prompt "What is the weather in Redmond, WA?" --tool_output --non_interactive --verbose

      - name: Prepend CUDA to PATH and Run tests
        run: |-
          $env:PATH = "$env:GITHUB_WORKSPACE\ort\ep;$env:GITHUB_WORKSPACE\ort\lib;${{ env.cuda_dir }}\\v${{ env.cuda_version }}\\bin;" + $env:PATH
          echo "Current PATH variable is: $env:PATH"
          & .\$env:binaryDir\Release\unit_tests.exe --ep_dir "$env:GITHUB_WORKSPACE\ort\ep"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\$env:binaryDir\Release\reinit_tests.exe --ep_dir "$env:GITHUB_WORKSPACE\ort\ep"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\$env:binaryDir\Release\engine_unit_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
