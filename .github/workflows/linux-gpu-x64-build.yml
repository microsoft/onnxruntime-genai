name: "Linux CUDA x64 Build"
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rel-*
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  ORT_BUILD_VERSION: "1.26.0"
  ORT_RUNTIME_VERSION: "1.30.0-dev-20260825-0522-9cbf665b59"
  ORT_BUILD_PACKAGE_NAME: Microsoft.ML.OnnxRuntime.Gpu.Linux
  ORT_RUNTIME_PACKAGE_NAME: microsoft.ml.onnxruntime
  ORT_EP_PACKAGE_NAME: Microsoft.ML.OnnxRuntime.EP.Cuda12.linux-x64
  ORT_EP_NUGET_VERSION: "0.2.0-dev.20260819+f1d07f0d"
  ORT_EP_PYPI_VERSION: "0.2.0.dev20260819"
  ORT_EP_PYPI_SOURCE: "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/pypi/simple/"
  DOTNET_INSTALL_DIR: "${{ github.workspace }}/dotnet"

jobs:
  linux-cuda-x64-build:
    permissions:
      contents: read
      packages: write # needed for GHCR push
    env:
      PYTHON_EXECUTABLE: "/opt/python/cp312-cp312/bin/python3.12"
    runs-on: ["self-hosted", "1ES.Pool=onnxruntime-genai-Ubuntu2204-A10"]
    steps:
      - name: Checkout OnnxRuntime GenAI repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true
      - name: Checkout ManyLinux repo  # We are using the same manylinux repo as the one used in the packaging build
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: pypa/manylinux
          ref: 5eda9aded5462201e6310105728d33016e637ea7
          clean: true
          path: manylinux
          submodules: true

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@47a55233e7a9e40e8ade1a71d1b6141be5044924 # v0.0.8
        with:
          vcpkg-version: '2025.03.19'
          vcpkg-hash: '17e96169cd3f266c4716fcdc1bb728e6a64f103941ece463a2834d50694eba4fb48f30135503fd466402afa139abc847ef630733c442595d1c34979f261b0114'
          cmake-version: '3.31.6'
          cmake-hash: '42395e20b10a8e9ef3e33014f9a4eed08d46ab952e02d2c1bbc8f6133eca0d7719fb75680f9bbff6552f20fcd1b73d86860f7f39388d631f98fb6f622b37cf04'
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@47a55233e7a9e40e8ade1a71d1b6141be5044924 # v0.0.8
        with:
          vcpkg-version: '2025.03.19'
          vcpkg-hash: '17e96169cd3f266c4716fcdc1bb728e6a64f103941ece463a2834d50694eba4fb48f30135503fd466402afa139abc847ef630733c442595d1c34979f261b0114'
          cmake-version: '3.31.6'
          cmake-hash: '42395e20b10a8e9ef3e33014f9a4eed08d46ab952e02d2c1bbc8f6133eca0d7719fb75680f9bbff6552f20fcd1b73d86860f7f39388d631f98fb6f622b37cf04'
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - name: Install Rust with rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"
          rustup install 1.86.0
          rustup override set 1.86.0
          rustup component add rust-src
          rustup show active-toolchain

      - name: Download build-time ONNX Runtime and test runtime packages
        run: |
          curl -fsSL \
            "https://pkgs.dev.azure.com/aiinfra/2692857e-05ef-43b4-ba9c-ccf1c22c437c/_apis/packaging/feeds/7982ae20-ed19-4a35-a362-a96ac99897b7/nuget/packages/${{ env.ORT_BUILD_PACKAGE_NAME }}/versions/${{ env.ORT_BUILD_VERSION }}/content?api-version=6.0-preview.1" \
            -o ort-build.zip
          curl -fsSL \
            "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/ORT-Nightly/nuget/v3/flat2/${{ env.ORT_RUNTIME_PACKAGE_NAME }}/${{ env.ORT_RUNTIME_VERSION }}/${{ env.ORT_RUNTIME_PACKAGE_NAME }}.${{ env.ORT_RUNTIME_VERSION }}.nupkg" \
            -o ort-runtime.zip
          curl -fsSL \
            "https://pkgs.dev.azure.com/aiinfra/PublicPackages/_apis/packaging/feeds/ORT-Nightly/nuget/packages/${{ env.ORT_EP_PACKAGE_NAME }}/versions/${{ env.ORT_EP_NUGET_VERSION }}/content?api-version=6.0-preview.1" \
            -o ort-ep.zip
          unzip -q ort-build.zip -d ort-build-package
          unzip -q ort-runtime.zip -d ort-runtime-package
          unzip -q ort-ep.zip -d ort-ep-package

      - name: list files
        shell: bash
        run: |
          ls -l
          ls -R ort-build-package
          ls -R ort-runtime-package
          ls -R ort-ep-package
        continue-on-error: true

      - name: Stage build-time and runtime ONNX Runtime files
        run: |
          set -e -x
          mkdir -p ort-build/lib ort/lib ort/ep
          mv ort-build-package/buildTransitive/native/include ort-build/
          mv ort-build-package/runtimes/linux-x64/native/* ort-build/lib/
          mv ort-runtime-package/runtimes/linux-x64/native/* ort/lib/
          mv ort-ep-package/runtimes/linux-x64/native/* ort/ep/
          cp ort-build/lib/libonnxruntime.so ort-build/lib/libonnxruntime.so.1
          cp ort/lib/libonnxruntime.so ort/lib/libonnxruntime.so.1
          test -f ort/ep/libonnxruntime_providers_cuda.so
          test ! -f ort/lib/libonnxruntime_providers_cuda.so

      - name: Get Docker Image
        run: |
          set -e -x
          az login --identity --object-id 161bbca8-9899-4f61-950c-4d556fbcf830
          az acr login --name onnxruntimebuildcache --subscription 00c06639-6ee4-454e-8058-8d8b1703bd87
          docker login --username "$GITHUB_ACTOR" --password '${{ secrets.GITHUB_TOKEN }}' ghcr.io

          python3 tools/ci_build/get_docker_image.py --dockerfile tools/ci_build/github/linux/docker/manylinux/Dockerfile.manylinux2_28_cuda_12.8  \
            --context tools/ci_build/github/linux/docker/manylinux  \
            --docker-build-args "--build-arg BUILD_UID=$( id -u )" \
            --manylinux-src manylinux \
            --multiple_repos \
            --repository onnxruntimecudabuildx64

      - name: Build with build.py in Docker
        run: |
          set -e -x
          docker run \
            --gpus all \
            --rm \
            --volume $GITHUB_WORKSPACE:/ort_genai_src \
            -w /ort_genai_src onnxruntimecudabuildx64 \
            bash -c " \
              ${{ env.PYTHON_EXECUTABLE }} -m pip install -r requirements-dev.txt && \
              CC=gcc CXX=g++ ${{ env.PYTHON_EXECUTABLE }} build.py \
                --config Release \
                --build_dir build/cuda \
                --cmake_generator Ninja \
                --build_java \
                --use_cuda \
                --cuda_home /usr/local/cuda \
                --ort_home /ort_genai_src/ort-build \
                --use_guidance \
                --update --build \
                --skip_examples \
                --cmake_path /usr/bin/cmake \
                --ctest_path /usr/bin/ctest \
                --cmake_extra_defines \
                  MANYLINUX=ON \
                  PYTHON_EXECUTABLE=${{ env.PYTHON_EXECUTABLE }} \
                  TEST_PHI2=False \
                  TEST_QWEN_2_5=True \
                  'CMAKE_CUDA_ARCHITECTURES=60-real;70-real;75-real;80-real;86-real;89-real;90-real;100-real;120' \
                  'CMAKE_EXE_LINKER_FLAGS_INIT=-Wl,-z,now' \
                  'CMAKE_MODULE_LINKER_FLAGS_INIT=-Wl,-z,now' \
                  'CMAKE_SHARED_LINKER_FLAGS_INIT=-Wl,-z,now' \
                  'CMAKE_C_FLAGS=-DNDEBUG -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS -fstack-protector-strong -O3 -pipe' \
                  'CMAKE_CXX_FLAGS=-DNDEBUG -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS -fstack-protector-strong -O3 -pipe'"

      - name: Build the C Examples in Docker
        run: |
          set -e -x
          docker run \
            --gpus all \
            --rm \
            --volume $GITHUB_WORKSPACE:/ort_genai_src \
            -w /ort_genai_src onnxruntimecudabuildx64 \
            bash -c " \
              /usr/bin/cmake -S examples/c -B examples/c/build \
                -DMODEL_QA=ON -DMODEL_CHAT=ON -DMODEL_MM=ON -DWHISPER=ON -DNEMOTRON_SPEECH=ON \
                -DORT_INCLUDE_DIR=/ort_genai_src/ort-build/include \
                -DORT_LIB_DIR=/ort_genai_src/ort-build/lib \
                -DOGA_INCLUDE_DIR=/ort_genai_src/src \
                -DOGA_LIB_DIR=/ort_genai_src/build/cuda/Release && \
              /usr/bin/cmake --build examples/c/build --config Release"

      - name: Run the Java tests in Docker
        run: |
          set -e -x
          docker run \
            --gpus all \
            --rm \
            --volume $GITHUB_WORKSPACE:/ort_genai_src \
            -w /ort_genai_src onnxruntimecudabuildx64 bash -c " \
              LD_LIBRARY_PATH=\$LD_LIBRARY_PATH:/ort_genai_src/ort/lib \
                /usr/bin/ctest --test-dir build/cuda/Release/src/java --build-config Release --verbose --timeout 10800"

      - name: Install the onnxruntime-genai Python wheel and run Python tests
        run: |
          echo "Installing the onnxruntime-genai Python wheel and running the Python tests"
          docker run \
            --gpus all \
            --rm \
            --volume /data/ortgenai/:/data/ortgenai/ \
            --volume $GITHUB_WORKSPACE:/ort_genai_src \
            -w /ort_genai_src onnxruntimecudabuildx64 bash -c " \
              export LD_LIBRARY_PATH=/ort_genai_src/ort/lib:/ort_genai_src/ort/ep:\${LD_LIBRARY_PATH} && \
              ${{ env.PYTHON_EXECUTABLE }} -m pip install -r test/python/requirements.txt --user && \
              ${{ env.PYTHON_EXECUTABLE }} -m pip install -r test/python/cuda/torch/requirements.txt --user && \
              ${{ env.PYTHON_EXECUTABLE }} -m pip uninstall -y onnxruntime-gpu && \
              ${{ env.PYTHON_EXECUTABLE }} -m pip install --index-url ${{ env.ORT_EP_PYPI_SOURCE }} -r test/python/cuda/ort/requirements.txt --user && \
              ${{ env.PYTHON_EXECUTABLE }} -m pip install --index-url ${{ env.ORT_EP_PYPI_SOURCE }} onnxruntime-ep-cuda12==${{ env.ORT_EP_PYPI_VERSION }} --user && \
              ${{ env.PYTHON_EXECUTABLE }} -m pip install /ort_genai_src/build/cuda/Release/wheel/onnxruntime_genai*manylinux*.whl --force-reinstall --no-deps --user && \
              ${{ env.PYTHON_EXECUTABLE }} -m pytest -sv test/python/test_onnxruntime_genai_engine.py && \
              ${{ env.PYTHON_EXECUTABLE }} test/python/test_onnxruntime_genai.py --cwd test/python --test_models test/models --e2e"

      # TODO: Enable this by adding dotnet to the docker image
      # - name: Build the C# API and Run the C# Tests
      #   run: |
      #     echo "Building the C# API and running the C# tests"
      #     docker run \
      #       --gpus all \
      #       --rm \
      #       --volume $GITHUB_WORKSPACE:/ort_genai_src \
      #       -w /ort_genai_src/test/csharp onnxruntimecudabuildx64 bash -c " \
      #         dotnet test /p:NativeBuildOutputDir='/ort_genai_src/build/cuda/Release/'"

      - name: Docker -- Run unit tests
        run: |
          echo "Running docker image onnxruntimecudabuildx64"
          rm -f build/cuda/Release/libonnxruntime_providers_cuda.so
          test ! -f build/cuda/Release/libonnxruntime_providers_cuda.so
          docker run \
            --gpus all \
            --rm \
            --volume /data/ortgenai/:/data/ortgenai/ \
            --volume $GITHUB_WORKSPACE:/ort_genai_src \
            -w /ort_genai_src onnxruntimecudabuildx64 bash -c " \
              export ORTGENAI_LOG_ORT_LIB=1 && \
              export LD_LIBRARY_PATH=/ort_genai_src/ort/lib:/ort_genai_src/ort/ep:/ort_genai_src/build/cuda/Release/:\${LD_LIBRARY_PATH} && \
              /ort_genai_src/build/cuda/Release/unit_tests --ep_dir /ort_genai_src/ort/ep && \
              /ort_genai_src/build/cuda/Release/reinit_tests --ep_dir /ort_genai_src/ort/ep && \
              /ort_genai_src/build/cuda/Release/engine_unit_tests --ep_dir /ort_genai_src/ort/ep"
