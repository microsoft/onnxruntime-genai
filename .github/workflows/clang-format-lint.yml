name: Clang Format Lint

on:
  push:
    branches:
      - main
      - rel-*
  pull_request:
    branches:
      - main
      - rel-*
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint-action-pins:
    name: GitHub Actions pinning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check action SHA pins
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"
          no_api: ${{ github.event_name != 'schedule' }}
          verify: ${{ github.event_name == 'schedule' }}

  lint-cpp:
    runs-on: ort-genai-github-linux-16-amd-wcus-ss
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'false'

      - name: Check format
        uses: microsoft/onnxruntime-github-actions/format-lint-check@f752b887c8e6e687f7fc0bca48918da42d1146a8 # v0.0.15
        with:
          llvm-version: '20.1.0'
          llvm-sha256-hash: '954ac51498519f6ed9540714fb04bc401f70039b296a8160dd1559be380788d7'
