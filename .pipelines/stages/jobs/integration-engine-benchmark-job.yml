parameters:
- name: run_full_engine_benchmark
  type: boolean

jobs:
- job: engine_benchmark_linux_x64
  displayName: 'Engine benchmark'
  pool: 'onnx-publish-Linux-GPU-H100'
  workspace:
    clean: all

  variables:
  - name: buildConfig
    value: RelWithDebInfo
  - name: benchmarkOut
    value: '$(Build.ArtifactStagingDirectory)/engine-benchmark'

  steps:
  - checkout: self
    clean: true
    submodules: recursive

  - bash: mkdir -p '$(benchmarkOut)'
    displayName: 'Initialize benchmark output'

  # ACR login and the CUDA build-container pattern follow integration-build-job.yml.
  - task: Docker@2
    displayName: 'Login to Azure container registry'
    inputs:
      containerRegistry: 'onnxruntimebuildcache'
      command: 'login'
      addPipelineData: false

  - bash: |
      set -e -x
      docker run --rm \
        -v '$(Build.Repository.LocalPath):/ort_genai_src' \
        -w /ort_genai_src \
        onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda12_x64_almalinux8_gcc14:20251017.1 \
        /bin/bash -c '
          set -e -x
          PYTHON_EXE=/opt/python/cp312-cp312/bin/python3.12
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          $PYTHON_EXE -m pip install --upgrade pip
          $PYTHON_EXE -m pip install -r requirements-dev.txt
          $PYTHON_EXE -m pip install -r benchmark/requirements.txt
          $PYTHON_EXE build.py --update --build \
            --config $(buildConfig) \
            --parallel \
            --use_cuda \
            --cuda_home /usr/local/cuda \
            --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES=90 \
            --cmake_extra_defines PYTHON_EXECUTABLE=$PYTHON_EXE \
            --skip_tests \
            --skip_examples \
            --build_engine_benchmark
        '
    displayName: 'Build engine benchmark in CUDA container'
    workingDirectory: '$(Build.Repository.LocalPath)'

  - bash: |
      set -e -x
      docker run --rm \
        -v '$(Build.Repository.LocalPath):/ort_genai_src' \
        -w /ort_genai_src \
        onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda12_x64_almalinux8_gcc14:20251017.1 \
        /bin/bash -c '
          set -e -x
          PYTHON_EXE=/opt/python/cp312-cp312/bin/python3.12
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          $PYTHON_EXE -m pip install --upgrade pip
          $PYTHON_EXE -m pip install -r test/python/requirements.txt
          $PYTHON_EXE -m pip install -r test/python/cuda/torch/requirements.txt

          export HOME=/ort_genai_src/build/engine-benchmark-home
          MODEL_ROOT=$HOME/models
          MODEL_CACHE=/ort_genai_src/build/engine-benchmark-model-cache
          mkdir -p "$MODEL_ROOT" "$MODEL_CACHE"

          # The smoke-test.json config uses the 0.5B model for a quick run, but
          # the full config.json uses 1.5B and 7B models as well. Add/remove models
          # here to match the config used in the next step.
          declare -A models=(
            [qwen2.5-0.5b-instruct]=Qwen/Qwen2.5-0.5B-Instruct
          )
          declare -A full_models=(
            [qwen2.5-1.5b-instruct]=Qwen/Qwen2.5-1.5B-Instruct
            [qwen2.5-7b-instruct]=Qwen/Qwen2.5-7B-Instruct
          )
          if [ '${{ parameters.run_full_engine_benchmark }}' = 'True' ]; then
            for name in "${!full_models[@]}"; do
              models[$name]="${full_models[$name]}"
            done
          fi

          # PagedAttention builder options follow the regeneration command in
          # test/python/integration/README.md.
          for name in "${!models[@]}"; do
            source="${models[$name]}"
            output="$MODEL_ROOT/$name"
            rm -rf "$output"
            $PYTHON_EXE src/python/py/models/builder.py \
              -m "$source" \
              -o "$output" \
              -p int4 \
              -e cuda \
              -c "$MODEL_CACHE" \
              --extra_options use_paged_attention=true shared_embeddings=false hf_token=false
            test -f "$output/genai_config.json"
            test -f "$output/model.onnx"
          done
        '
    displayName: 'Build benchmark models in CUDA container'
    workingDirectory: '$(Build.Repository.LocalPath)'

  # GPU-enabled container execution follows integration-pytest-step.yml.
  - bash: |
      set -e -x
      config='benchmark/engine/configs/smoke-test.json'
      if [ '${{ parameters.run_full_engine_benchmark }}' = 'True' ]; then
        config='benchmark/engine/configs/config.json'
      fi

      docker run --rm --gpus all \
        -e HOME=/ort_genai_src/build/engine-benchmark-home \
        -v '$(Build.Repository.LocalPath):/ort_genai_src' \
        -v '$(benchmarkOut):/benchmark-out' \
        -w /ort_genai_src \
        onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda12_x64_almalinux8_gcc14:20251017.1 \
        /bin/bash -c "
          set -e -x
          PYTHON_EXE=/opt/python/cp312-cp312/bin/python3.12
          gpu_ids=\$(nvidia-smi --query-gpu=index --format=csv,noheader | paste -sd, -)
          test -n \"\$gpu_ids\"

          # Set relevant env vars for the benchmark executable to find its dependencies
          CUDA_LIB_DIR=/usr/local/cuda/lib64
          BENCHMARK_LIB_DIR=/ort_genai_src/build/Linux/$(buildConfig)/benchmark/engine
          export LD_LIBRARY_PATH=\$CUDA_LIB_DIR:\$BENCHMARK_LIB_DIR:\${LD_LIBRARY_PATH:-}
          echo \"LD_LIBRARY_PATH=\$LD_LIBRARY_PATH\"

          \$PYTHON_EXE benchmark/engine/run.py \
            --executable /ort_genai_src/build/Linux/$(buildConfig)/benchmark/engine/engine_benchmark \
            --config \"$config\" \
            --out /benchmark-out \
            --cuda_visible_devices \"\$gpu_ids\" \
            --verbose
        "
    displayName: 'Run engine benchmark in CUDA container'
    workingDirectory: '$(Build.Repository.LocalPath)'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish engine benchmark results'
    condition: always()
    inputs:
      artifactName: 'engine-benchmark-results'
      targetPath: '$(benchmarkOut)'