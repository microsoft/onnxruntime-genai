parameters:
- name: run_full_engine_benchmark
  type: boolean

jobs:
- job: engine_benchmark_linux_x64
  displayName: 'Linux x64'
  pool: 'onnx-publish-Linux-GPU-H100'
  workspace:
    clean: all

  variables:
  - name: buildConfig
    value: RelWithDebInfo

  steps:
  - checkout: self
    clean: true
    submodules: recursive

  - bash: mkdir -p '$(Build.ArtifactStagingDirectory)/engine-benchmark' '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models'
    displayName: 'Initialize benchmark directories'

  # ACR login and the CUDA build-container pattern follow integration-build-job.yml.
  - task: Docker@2
    displayName: 'Login to Azure container registry'
    inputs:
      containerRegistry: 'onnxruntimebuildcache'
      command: 'login'
      addPipelineData: false

  - bash: |
      set -e -x
      docker run --rm \
        -v '$(Build.Repository.LocalPath):/ort_genai_src' \
        -w /ort_genai_src \
        onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda12_x64_almalinux8_gcc14:20251017.1 \
        /bin/bash -c '
          set -e -x
          PYTHON_EXE=/opt/python/cp312-cp312/bin/python3.12
          export PATH=/opt/python/cp312-cp312/bin:$PATH
          $PYTHON_EXE -m pip install --upgrade pip
          $PYTHON_EXE -m pip install -r requirements-dev.txt
          $PYTHON_EXE -m pip install -r benchmark/requirements.txt
          $PYTHON_EXE build.py --update --build \
            --config $(buildConfig) \
            --parallel \
            --use_cuda \
            --cuda_home /usr/local/cuda \
            --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES=90 \
            --cmake_extra_defines PYTHON_EXECUTABLE=$PYTHON_EXE \
            --skip_tests \
            --skip_examples \
            --build_engine_benchmark
        '
    displayName: 'Build engine benchmark'
    workingDirectory: '$(Build.Repository.LocalPath)'

  # These immutable models were built for the ORT/CUDA plugin versions pinned by the benchmark.
  - task: UniversalPackages@0
    displayName: 'Download Qwen 2.5 0.5B benchmark model'
    inputs:
      command: download
      feedsToUse: internal
      vstsFeed: '4c7631f5-24c0-4307-8822-1aa8f180c325'
      vstsFeedPackage: 'engine-benchmark-qwen2-5-0-5b-instruct'
      vstsPackageVersion: '1.0.0'
      downloadDirectory: '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-0.5b-instruct'

  - ${{ if eq(parameters.run_full_engine_benchmark, true) }}:
    - task: UniversalPackages@0
      displayName: 'Download Qwen 2.5 1.5B benchmark model'
      inputs:
        command: download
        feedsToUse: internal
        vstsFeed: '4c7631f5-24c0-4307-8822-1aa8f180c325'
        vstsFeedPackage: 'engine-benchmark-qwen2-5-1-5b-instruct'
        vstsPackageVersion: '1.0.0'
        downloadDirectory: '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-1.5b-instruct'

    - task: UniversalPackages@0
      displayName: 'Download Qwen 2.5 7B benchmark model'
      inputs:
        command: download
        feedsToUse: internal
        vstsFeed: '4c7631f5-24c0-4307-8822-1aa8f180c325'
        vstsFeedPackage: 'engine-benchmark-qwen2-5-7b-instruct'
        vstsPackageVersion: '1.0.0'
        downloadDirectory: '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-7b-instruct'

  # Keep the paged KV-cache below the CUDA arena's large-allocation growth
  # boundary on 96 GB H100 GPUs. The downloaded Universal Packages remain immutable.
  - bash: |
      set -euo pipefail
      python3 - <<'PY'
      import json
      from pathlib import Path

      model_root = Path("$(Build.Repository.LocalPath)/build/engine-benchmark-home/models")
      config_paths = sorted(model_root.glob("*/genai_config.json"))
      if not config_paths:
          raise RuntimeError(f"No benchmark model configs found under {model_root}")

      for config_path in config_paths:
          config = json.loads(config_path.read_text(encoding="utf-8"))
          dynamic_batching = config["engine"]["dynamic_batching"]
          previous = dynamic_batching.get("gpu_utilization_factor")
          dynamic_batching["gpu_utilization_factor"] = 0.5
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          print(f"{config_path}: gpu_utilization_factor {previous} -> 0.5")
      PY
    displayName: 'Limit benchmark KV-cache allocation'

  - bash: |
      set -e -x
      test -f '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-0.5b-instruct/genai_config.json'
      test -f '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-0.5b-instruct/model.onnx'
    displayName: 'Validate smoke benchmark model'

  - ${{ if eq(parameters.run_full_engine_benchmark, true) }}:
    - bash: |
        set -e -x
        test -f '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-1.5b-instruct/genai_config.json'
        test -f '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-1.5b-instruct/model.onnx'
        test -f '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-7b-instruct/genai_config.json'
        test -f '$(Build.Repository.LocalPath)/build/engine-benchmark-home/models/qwen2.5-7b-instruct/model.onnx'
      displayName: 'Validate full benchmark models'

  # GPU-enabled container execution follows integration-pytest-step.yml.
  - bash: |
      set -e -x
      config='benchmark/engine/configs/smoke-test.json'
      if [ '${{ parameters.run_full_engine_benchmark }}' = 'True' ]; then
        config='benchmark/engine/configs/config.json'
      fi

      benchmark_status=0
      # HOME env var matches the config paths to the downloaded packages without rewriting configs.
      docker run --rm --gpus all \
        -e HOME=/ort_genai_src/build/engine-benchmark-home \
        -v '$(Build.Repository.LocalPath):/ort_genai_src' \
        -v '$(Build.ArtifactStagingDirectory)/engine-benchmark:/benchmark-out' \
        -w /ort_genai_src \
        onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda12_x64_almalinux8_gcc14:20251017.1 \
        /bin/bash -c "
          set -e -x
          PYTHON_EXE=/opt/python/cp312-cp312/bin/python3.12

          # Set relevant env vars for the benchmark executable to find its dependencies
          CUDA_LIB_DIR=/usr/local/cuda/lib64
          BENCHMARK_LIB_DIR=/ort_genai_src/build/Linux/$(buildConfig)/benchmark/engine
          export LD_LIBRARY_PATH=\$CUDA_LIB_DIR:\$BENCHMARK_LIB_DIR:\${LD_LIBRARY_PATH:-}
          echo \"LD_LIBRARY_PATH=\$LD_LIBRARY_PATH\"

          nvidia-smi

          \$PYTHON_EXE benchmark/engine/run.py \
            --executable /ort_genai_src/build/Linux/$(buildConfig)/benchmark/engine/engine_benchmark \
            --config \"$config\" \
            --out /benchmark-out \
            --cuda_visible_devices 0 \
            --verbose
        " || benchmark_status=$?

      echo 'Benchmark output files:'
      while IFS= read -r -d '' output_file; do
        printf '\n===== %s =====\n' "$output_file"
        cat "$output_file"
        printf '\n===== end %s =====\n' "$output_file"
      done < <(find '$(Build.ArtifactStagingDirectory)/engine-benchmark' -type f -print0 | sort -z)

      exit "$benchmark_status"
    displayName: 'Run engine benchmark'
    workingDirectory: '$(Build.Repository.LocalPath)'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish engine benchmark results'
    inputs:
      artifactName: 'engine-benchmark-results'
      targetPath: '$(Build.ArtifactStagingDirectory)/engine-benchmark'